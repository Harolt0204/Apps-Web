<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Contact - My University Website</title>
</head>
<body>

    <header>
        <nav>
            <a href="../index.html">Home</a> |
            <a href="courses.html">Courses</a> |
            <a href="schedule.html">Schedule</a> |
            <a href="contact.html">Contact</a> |
            <a href="hobbies.html">Hobbies</a> |
            <a href="clubs.html">Clubs</a>
        </nav>
        <h1>Contact Form</h1>
    </header>

    <main>
        <form action="#" method="get">
            <p>
                <label for="name">Full Name:</label><br>
                <input type="text" id="name" name="name" required>
            </p>
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="dob">Date of Birth:</label><br>
                <input type="date" id="dob" name="dob" required>
            </p>
            <p>
                <label for="degree">Major:</label><br>
                <input type="text" id="degree" name="degree" required>
            </p>
            <p>
                <label for="semester">Semester:</label><br>
                <input type="number" id="semester" name="semester" min="1" max="10" required>
            </p>
            <p>
                <label for="reason">Reason for Contact:</label><br>
                <select id="reason" name="reason">
                    <option value="consulta">Academic Inquiry</option>
                    <option value="proyecto">Research Project</option>
                    <option value="otro">Other</option>
                </select>
            </p>
            <p>
                <label for="message">Message:</label><br>
                <textarea id="message" name="message" rows="5" cols="40" required></textarea>
            </p>
            <p>
                <input type="checkbox" id="terms" name="terms" required>
                <label for="terms">I agree to the terms of contact</label>
            </p>
            <p>
                <button type="submit">Send Message</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Yachay Tech</p>
    </footer>

</body>
</html>
