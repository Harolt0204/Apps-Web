<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workshop 3 - Interactive Webpage</title>
    <link rel="stylesheet" href="style.css">
    <!-- Link the latest jQuery version -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- Navigation Bar -->
    <nav class="navbar">
        <ul class="nav-links">
            <li><a href="#hero">Home</a></li>
            <li><a href="#gallery">Gallery</a></li>
            <li><a href="#contact">Contact</a></li>
        </ul>
    </nav>

    <!-- Hero Section -->
    <section id="hero" class="hero-section">
        <h1>Welcome to Interactive Webpage</h1>
        <p>This is a short description for the hero section of Workshop 3. Discover our gallery and contact us!</p>
        <button id="changeColorBtn">Change Background Color</button>
    </section>

    <!-- Image Gallery -->
    <section id="gallery" class="gallery-section">
        <h2>Image Gallery</h2>
        <div class="gallery-grid">
            <img src="images/compu.png" alt="Gallery Image 1" class="gallery-img">
            <img src="images/hobbi1.jpeg" alt="Gallery Image 2" class="gallery-img">
            <img src="images/logoU.png" alt="Gallery Image 3" class="gallery-img">
            <img src="images/profile.jpg" alt="Gallery Image 4" class="gallery-img">
        </div>
    </section>

    <!-- Modal for Image Gallery -->
    <div id="imageModal" class="modal">
        <span class="close-modal">&times;</span>
        <img class="modal-content" id="modalImg" alt="Enlarged gallery image">
    </div>

    <!-- Contact Form -->
    <section id="contact" class="contact-section">
        <h2>Contact Us</h2>
        <form id="contactForm">
            <div class="form-group">
                <label for="name">Name:</label>
                <input type="text" id="name" name="name">
            </div>
            <div class="form-group">
                <label for="email">Email:</label>
                <input type="email" id="email" name="email">
            </div>
            <div class="form-group">
                <label for="message">Message:</label>
                <textarea id="message" name="message" rows="4"></textarea>
            </div>
            <button type="submit" id="submitBtn">Submit</button>
        </form>
    </section>

    <script src="script.js"></script>
</body>
</html>
